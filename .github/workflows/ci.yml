name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter ships its own Dart SDK; install it instead of a
      # bare Dart SDK so `pub get` can resolve the Flutter `example/`
      # alongside the root package. (pub auto-resolves dependencies
      # of the conventional `example/` folder — pub.dev surfaces it
      # on the package page — and the example imports `flutter` and
      # `flutter_test`.)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'example/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: pub get
        run: dart pub get

      - name: Verify lib/version.dart is in sync with pubspec.yaml
        run: dart run tool/sync_version.dart --check

      - name: Verify lib/templates/ is in sync with templates/
        run: dart run tool/sync_templates.dart --check

      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed .

      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: dart test
        run: dart test --reporter expanded
