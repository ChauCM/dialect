name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: dart pub get
        run: dart pub get

      - name: Verify lib/version.dart is in sync with pubspec.yaml
        run: dart run tool/sync_version.dart --check

      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed .

      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: dart test
        run: dart test --reporter expanded
