name: Release

# Tag-driven: pushing `v1.0.0`, `v1.0.0-rc.1`, etc. fans out into a
# matrix build of pre-compiled binaries, attaches them to the GitHub
# release, publishes to pub.dev, and opens a bump-PR against
# ChauCM/homebrew-tap.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub release
  id-token: write   # OIDC for pub.dev publishing

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-x64 and linux-arm64 are deliberately not built:
        # - macos-13 runners have hours-long queues and are deprecated by GitHub.
        # - subosito/flutter-action cannot resolve Flutter for Linux arm64
        #   ("Unable to determine Flutter version … architecture: arm64").
        # Intel-Mac / Linux-arm64 users build from source.
        include:
          - os: macos-latest        # Apple Silicon
            target: macos-arm64
            archive_ext: tar.gz
            exe_suffix: ''
          - os: ubuntu-latest
            target: linux-x64
            archive_ext: tar.gz
            exe_suffix: ''
          - os: windows-latest
            target: windows-x64
            archive_ext: zip
            exe_suffix: '.exe'
    steps:
      - uses: actions/checkout@v4

      # Use Flutter (which ships its own Dart) so `pub get` can resolve
      # the example/ Flutter app alongside the root package. Matches the
      # CI workflow.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: dart pub get
        run: dart pub get

      - name: pnpm install + build (dashboard)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bake dashboard into embedded_assets.g.dart
        run: dart run tool/build_dashboard.dart --no-pnpm

      - name: Compile binary
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/dialect.dart \
            -o "build/dialect${{ matrix.exe_suffix }}"

      - name: Package archive (unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd build
          tar -czf "dialect-${{ matrix.target }}.tar.gz" dialect
          shasum -a 256 "dialect-${{ matrix.target }}.tar.gz" \
            > "dialect-${{ matrix.target }}.tar.gz.sha256"

      - name: Package archive (windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path dialect.exe `
            -DestinationPath "dialect-${{ matrix.target }}.zip"
          (Get-FileHash -Algorithm SHA256 "dialect-${{ matrix.target }}.zip").Hash.ToLower() `
            + "  dialect-${{ matrix.target }}.zip" `
            | Out-File -Encoding ASCII "dialect-${{ matrix.target }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dialect-${{ matrix.target }}
          path: |
            build/dialect-${{ matrix.target }}.${{ matrix.archive_ext }}
            build/dialect-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose SHA256SUMS
        run: |
          mkdir -p release
          cp artifacts/dialect-*.tar.gz artifacts/dialect-*.zip release/ 2>/dev/null || true
          cat artifacts/dialect-*.sha256 > release/SHA256SUMS
          cat release/SHA256SUMS
          # Copy the installer script alongside the release so
          # `https://github.com/.../releases/download/<tag>/install.sh`
          # works as a stable fallback URL if dialect.tools is down.
          cp install.sh release/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/dialect-*.tar.gz
            release/dialect-*.zip
            release/SHA256SUMS
            release/install.sh

  pub:
    name: Publish to pub.dev
    needs: build
    runs-on: ubuntu-latest
    # pub.dev publishing uses OIDC. The repo must be registered as a
    # publisher at https://pub.dev/packages/dialect (manual step,
    # walked through in CHANGELOG / docs).
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      # Same reason as the build job: pub get walks into example/
      # which needs Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      # Mint a GitHub Actions OIDC token addressed to https://pub.dev,
      # then register it as a pub.dev credential. Without this, the
      # Flutter-bundled `dart` sometimes fails to auto-detect the
      # GitHub Actions environment and falls back to interactive
      # browser OAuth — which hangs the CI job forever (no stdin).
      # The publisher must have OIDC trust configured for this repo
      # at https://pub.dev/packages/dialect/admin (repository pattern
      # `ChauCM/dialect`, environment `pub.dev`, tag `v{{version}}`).
      - name: Authenticate to pub.dev via OIDC
        run: |
          set -eu
          OIDC_TOKEN="$(curl -fsSL \
            -H "Accept: application/json; api-version=2.0" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "Failed to mint OIDC token for pub.dev"; exit 1
          fi
          echo "$OIDC_TOKEN" | dart pub token add https://pub.dev
      - name: Publish
        run: dart pub publish --force

  homebrew:
    name: Bump Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Requires a personal access token in repo secrets named
    # HOMEBREW_TAP_GITHUB_TOKEN with `repo` scope on ChauCM/homebrew-tap.
    if: ${{ ! contains(github.ref_name, '-') }}   # skip prereleases (rc.*, beta.*)
    steps:
      - uses: actions/checkout@v4

      # Flutter ships Dart; same rationale as the build job.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Wait for release assets to be downloadable
        run: |
          # Brief sleep — softprops/action-gh-release returns before
          # downloads propagate. 15s is more than enough.
          sleep 15

      - name: Render formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          dart run tool/render_homebrew_formula.dart \
            --version "$VERSION" \
            > /tmp/dialect.rb
          cat /tmp/dialect.rb

      - name: Push formula directly to ChauCM/homebrew-tap main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ github.ref_name }}"
          git config --global user.name "dialect-release-bot"
          git config --global user.email "noreply@dialect.tools"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/ChauCM/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/dialect.rb tap/Formula/dialect.rb
          cd tap
          if git diff --quiet -- Formula/dialect.rb; then
            echo "No formula change for ${VERSION}; skipping push."
            exit 0
          fi
          git add Formula/dialect.rb
          git commit -m "Dialect ${VERSION}"
          git push origin main

  major-tag:
    name: Bump moving major tag
    needs: release
    runs-on: ubuntu-latest
    # Re-point e.g. `v1` -> the latest `v1.x.y` so users can pin
    # `uses: ChauCM/dialect@v1` and get the newest patch automatically.
    # Skips prereleases — `v1.0.0-rc.1` shouldn't promote `v1`.
    if: ${{ ! contains(github.ref_name, '-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update v<MAJOR> tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          # Strip leading "v", take "<MAJOR>", re-prefix.
          MAJOR="v${VERSION#v}"
          MAJOR="${MAJOR%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$VERSION"
          git push -f origin "$MAJOR"
