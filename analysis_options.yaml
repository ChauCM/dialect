# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`.
# This set helps identify many issues that may lead to problems when running
# or consuming Dart code, and enforces writing Dart using a single, idiomatic
# style and format.
#
# If you want a smaller set of lints you can change this to specify
# 'package:lints/core.yaml'. These are just the most critical lints
# (the recommended set includes the core lints).
# The core lints are also what is used by pub.dev for scoring packages.

include: package:lints/recommended.yaml

# Hand-picked additions on top of `package:lints/recommended.yaml`. We
# intentionally do not switch wholesale to `package:very_good_analysis` —
# its stylistic rules (always-final-locals, no-print-in-CLI) would fight
# CLI development. These are the safety/clarity rules without the noise.
linter:
  rules:
    - unawaited_futures        # Catch fire-and-forget Futures.
    - avoid_dynamic_calls      # Force typed access; M2 substrate is typed.
    - prefer_relative_imports  # Within lib/, prefer `../arb/foo.dart` over `package:dialect/arb/foo.dart`.
    - directives_ordering      # Stable, deterministic import ordering.
    - prefer_final_locals      # Locals are immutable unless explicitly mutated.
    - cancel_subscriptions     # Stream subscriptions must be cancelled.
    - close_sinks              # IOSinks/StreamSinks must be closed.

analyzer:
  exclude:
    # `example/` is a separate Flutter package with its own pubspec.yaml.
    # Analyze it independently via `cd example && dart analyze`.
    - example/**

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints

# For additional information about configuring this file, see
# https://dart.dev/guides/language/analysis-options
