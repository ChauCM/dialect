# ============================================================
# Project glossary — Dialect convention
# ============================================================
# Terms with non-obvious or domain-specific translations.
# `dialect check` verifies that translations of strings
# containing these terms use the prescribed translation.
#
# Escape hatch: if a string uses a term in a non-literal sense
# (e.g. "Book club" really means a physical book), mark the
# key with @key.glossary_exempt: true in the locale ARB.
# ============================================================

terms:
  - term: "Book"
    meaning: >
      Verb. To make a reservation, e.g. "Book this stay".
      NOT a physical book. If the word appears as a noun in
      the sense of a printed book, mark the key glossary_exempt.
    translations:
      es: "Reservar"
      ja: "予約する"
      ar: "احجز"
      de: "Buchen"
      vi: "Đặt"

  - term: "Host"
    meaning: >
      Noun. A person who lists their property on the platform.
      NOT a computer server or a party host. Capitalized in
      English when used as a role.
    translations:
      es: "Anfitrión"
      ja: "ホスト"
      ar: "المضيف"
      de: "Gastgeber"
      vi: "Chủ nhà"

  - term: "Trip"
    meaning: >
      Noun. A planned stay booked through the platform — the
      whole journey including dates and destination. NOT a
      stumble or a business trip in the corporate sense.
    translations:
      es: "Viaje"
      ja: "旅行"
      ar: "رحلة"
      de: "Reise"
      vi: "Chuyến đi"

style:
  tone: "friendly, concise, second-person"
  formality:
    es: "tú (informal)"
    ja: "です/ます (polite-neutral)"
    ar: "Modern Standard Arabic, informal"
    de: "du (informal — match consumer travel apps, not enterprise)"
    vi: "bạn (informal)"

  # Rules of thumb that apply across every locale.
  general:
    - "Keep button labels short — fewer characters than the English original where possible."
    - "Do not translate brand names, currency symbols, or units."
    - "Preserve all ICU placeholders ({name}, {count}, etc.) exactly as in source."
    - "Preserve all plural categories ICU expects for the target locale."
