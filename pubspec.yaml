name: dialect
description: AI-native localization toolkit for Flutter-led teams.
version: 1.0.3
repository: https://github.com/ChauCM/dialect

environment:
  # Pre-1.0 policy: track current stable Dart. Bump whenever a feature
  # would simplify code or unblock a workaround. At 1.0 launch, lock to
  # "current and previous two minor SDK versions" — documented in
  # CONTRIBUTING.md at that point.
  sdk: ^3.11.0

executables:
  dialect: dialect

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  unorm_dart: ^0.3.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
